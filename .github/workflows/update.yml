name: Update Poster

permissions:
  contents: write

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Requests
        run: pip install requests

      - name: Run Script
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python update.py

      - name: Commit Changes
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add posters/anime.jpg
          git commit -m "Update poster" || exit 0
          git push
